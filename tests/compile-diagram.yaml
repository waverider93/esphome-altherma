# Generated by tools/make_compile_test.py from examples/altherma-ech2o.yaml - do not edit.
# Ethernet and the bare web server instead of WiFi and the dashboard: builds without registry downloads.
# Daikin Altherma 3 R ECH2O (EHSX04P50EF + ERGA04EV) on an ESP32 with relay board.
# X10A: ESP RX <- X10A pin 2 (TX), ESP TX -> X10A pin 3 (RX), GND <- X10A pin 5. See README.
#
# Relay pins are placeholders for an ESP32 board with 4 or 8 relays (LC-Relay-ESP32-4R-A2: probably 32/33/25/26).
# Check them on the board before wiring anything. The relays switch nothing until they are wired, and the heat pump
# only reacts to them after the field settings in README (Relays).

substitutions:
  name: x10a-diagram
  x10a_rx: GPIO16
  x10a_tx: GPIO17
  relay_heat: GPIO32  # COM + normally closed -> X12M 15 (H): relay off = heat request
  relay_cool: GPIO33  # COM + normally open   -> X12M 16 (C): relay on  = cool request
  relay_sg1: GPIO13   # X15M 3-4, Smart Grid contact 1 ([D-01]=3)
  relay_sg2: GPIO14   # X15M 5-6, Smart Grid contact 2
  relay_safety: GPIO4  # in series with the bridge X15M 7-8 (normally closed): relay on = heat pump stops
  fallback_minutes: "15"  # without Home Assistant this long, Smart Grid and Regelung go back to ESP

esphome:
  name: ${name}
  friendly_name: Altherma

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

logger:
  # The X10A uses UART2; keep the log on UART0 (USB)
  level: DEBUG

# Optional: the control runs without Home Assistant
api:

uart:
  id: x10a_uart
  rx_pin: ${x10a_rx}
  tx_pin: ${x10a_tx}
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1
  data_bits: 8

daikin_x10a:
  id: altherma
  uart_id: x10a_uart
  # A fixed model; the survey after boot still checks it and corrects register layouts. "auto" detects it.
  model: "ERGA E EHSH-X P30-50 E_EF series 04-08kW-ECH2O"
  language: de        # entity names without name: and the diagram page
  diagram: true       # drawing of the installation on http://altherma.local/altherma/
  all_values: true    # every other value of the model too (Home Assistant: diagnostic, a few disabled)
  update_interval: 30s
  # true logs every reply as hex, for comparing with ESPAltherma
  log_raw: false

sensor:
  - platform: daikin_x10a
    id: room
    label: "Indoor ambient temp. (R1T)"
    name: Raumtemperatur Madoka
  - platform: daikin_x10a
    id: room_setpoint
    label: "RT setpoint"
    name: Raum Soll
  - platform: daikin_x10a
    id: outside
    label: "R1T-Outdoor air temp."
    name: Außentemperatur
  - platform: daikin_x10a
    label: "Leaving water temp. before BUH (R1T)"
    name: Vorlauf (R1T)
  - platform: daikin_x10a
    id: leaving_water
    label: "Leaving water temp. after BUH (R2T)"
    name: Vorlauf (R2T)
  - platform: daikin_x10a
    id: inlet_water
    label: "Inlet water temp.(R4T)"
    name: Rücklauf (R4T)
  - platform: daikin_x10a
    label: "DHW tank temp. (R5T)"
    name: Speicher (R5T)
  - platform: daikin_x10a
    label: "LW setpoint (main)"
    name: Vorlauf Soll
  - platform: daikin_x10a
    label: "DHW setpoint"
    name: Warmwasser Soll
  - platform: daikin_x10a
    id: water_flow
    label: "Flow sensor (l/min)"
    name: Durchfluss
  - platform: daikin_x10a
    id: compressor
    label: "INV frequency (rps)"
    name: Verdichter
    accuracy_decimals: 0
  - platform: daikin_x10a
    label: "RT Control State (0:thermo off 1:thermo on 2:buffering)"
    name: Raumregler Zustand
    accuracy_decimals: 0

  # Controller (altherma_control)
  - {platform: altherma_control, type: deficit, name: Regler Defizit}
  - {platform: altherma_control, type: ua, name: Regler UA gelernt}
  - {platform: altherma_control, type: heat_loss, name: Regler Wärmeverlust}
  - {platform: altherma_control, type: heat_delivered, name: Regler Heizleistung}
  - {platform: altherma_control, type: calibration_left, name: Regler nächste Kalibrierung}
  - {platform: altherma_control, type: self_stops, name: Regler Eigenstopps WP}

binary_sensor:
  - platform: daikin_x10a
    label: "Thermostat ON/OFF"
    register: 0x60
    name: Thermostat an
  - platform: daikin_x10a
    id: hot_water_valve
    label: "3way valve(On:DHW_Off:Space)"
    name: Warmwasserventil
  - platform: daikin_x10a
    label: "Water pump operation"
    name: Umwälzpumpe
  - platform: daikin_x10a
    label: "Defrost Operation"
    name: Abtauen
  - platform: daikin_x10a
    label: "Main RT Heating"
    name: Thermostateingang Heizen
  - platform: daikin_x10a
    label: "SmartGridContact1"
    name: SG-Kontakt 1
  - platform: daikin_x10a
    label: "SmartGridContact2"
    name: SG-Kontakt 2
  - platform: template
    name: X10A verbunden
    lambda: return id(altherma).is_connected();
    entity_category: diagnostic

text_sensor:
  - platform: daikin_x10a
    label: "I/U operation mode"
    name: Betriebsart
  - platform: daikin_x10a
    label: "Error Code"
    register: 0x60
    name: Fehlercode
  - platform: daikin_x10a
    info: model
    name: Modell
  - platform: daikin_x10a
    info: detection
    name: Modellerkennung
  - platform: daikin_x10a
    info: layout
    name: Layout-Korrekturen
  - platform: altherma_control
    name: Regler Grund

# --- Relays and control (stage 3) ---
# Fail-safe: a dead or unpowered ESP leaves the heat pump on its own control (heat request on through the normally
# closed contact, cooling, Smart Grid and the safety contact released). See docs/control-concept.md.
#
# "Regelung" says who switches the heat request, and only that side does:
#   ESP            the controller below (default). Runs without network; Home Assistant only watches, can change the
#                  settings, the Madoka setpoint and Smart Grid.
#   Home Assistant Home Assistant switches Heizanforderung/Kühlanforderung, for tests. The controller keeps
#                  calculating (shadow) without switching.

altherma_control:
  id: control
  room_temperature: room
  room_setpoint: room_setpoint
  outside_temperature: outside
  flow: water_flow
  leaving_water_temperature: leaving_water
  inlet_water_temperature: inlet_water
  hot_water_valve: hot_water_valve
  compressor_frequency: compressor  # run and pause count real compressor time
  heat_request: heat_relay
  cool_request: cool_relay
  ua: 90               # start value in W/K; learned from then on, kept in flash
  room_low: 0.5        # room below setpoint - 0.5 K: on at once
  room_high: 1.0       # room above setpoint + 1 K: off at once
  diagram_id: altherma # shows the controller with an explanation on /altherma/

number:
  - {platform: altherma_control, type: start, name: Regler Start}
  - {platform: altherma_control, type: stop, name: Regler Stopp}
  - {platform: altherma_control, type: min_run, name: Regler Mindestlaufzeit}
  - {platform: altherma_control, type: min_pause, name: Regler Mindestpause}
  - {platform: altherma_control, type: room_gain, name: Regler Raumkorrektur}
  - {platform: altherma_control, type: ua, name: Regler UA}

select:
  - platform: template
    id: control_mode
    name: Regelung
    options: [ESP, Home Assistant]
    initial_option: ESP
    restore_value: true
    optimistic: true
    on_value:
      - lambda: id(control).set_active(i == 0);
  # Smart Grid contacts X15M 3-4 / 5-6 ([D-01]=3): 00 normal, 01 recommended on, 10 blocked, 11 forced on.
  # Set from Home Assistant (PV, price); back to Normal when Home Assistant is gone.
  - platform: template
    id: smart_grid
    name: Smart Grid
    options: [Normal, Einschaltempfehlung, Sperre, Zwangs-EIN]
    initial_option: Normal
    restore_value: false
    optimistic: true
    on_value:
      - lambda: |-
          id(sg1).set_state(i == 2 || i == 3);
          id(sg2).set_state(i == 1 || i == 3);

switch:
  # The relays themselves: internal, switched by the controller or, in mode Home Assistant, by the requests below.
  # Heat: X12M 15 (H), COM + normally closed, energised to REMOVE the request.
  - platform: gpio
    id: heat_relay
    internal: true
    pin:
      number: ${relay_heat}
      inverted: true
    restore_mode: ALWAYS_ON
    interlock: [cool_relay]
  # Cool: X12M 16 (C), COM + normally open. Only used with [C-05]=2.
  - platform: gpio
    id: cool_relay
    internal: true
    pin: ${relay_cool}
    restore_mode: ALWAYS_OFF
    interlock: [heat_relay]
  # Requests from Home Assistant or the web page: executed only in mode Home Assistant
  - platform: template
    id: heat_request
    name: Heizanforderung
    lambda: return id(heat_relay).state;
    turn_on_action:
      - if:
          condition: {lambda: return id(control_mode).active_index().value_or(0) == 1;}
          then: [switch.turn_on: heat_relay]
          else: [logger.log: {format: "Heizanforderung ignored: Regelung is ESP", level: WARN}]
    turn_off_action:
      - if:
          condition: {lambda: return id(control_mode).active_index().value_or(0) == 1;}
          then: [switch.turn_off: heat_relay]
          else: [logger.log: {format: "Heizanforderung ignored: Regelung is ESP", level: WARN}]
  # Cooling is switched by hand in both modes; the controller does not heat while it is on
  - platform: template
    id: cool_request
    name: Kühlanforderung
    lambda: return id(cool_relay).state;
    turn_on_action: [switch.turn_on: cool_relay]
    turn_off_action: [switch.turn_off: cool_relay]
  # Opens the safety thermostat loop X15M 7-8: the heat pump stops with an error. Emergency use only, any mode.
  - platform: gpio
    id: safety_stop
    name: Sicherheitsabschaltung
    icon: mdi:alert-octagon
    pin: ${relay_safety}
    restore_mode: ALWAYS_OFF

output:
  - platform: gpio
    id: sg1
    pin: ${relay_sg1}
  - platform: gpio
    id: sg2
    pin: ${relay_sg2}

globals:
  - id: minutes_without_ha
    type: int
    initial_value: "0"

interval:
  - interval: 1min
    then:
      - lambda: |-
          bool ha = false;
          #ifdef USE_API
          ha = api::global_api_server->is_connected();
          #endif
          if (ha) {
            id(minutes_without_ha) = 0;
            return;
          }
          if (++id(minutes_without_ha) != ${fallback_minutes})
            return;
          ESP_LOGW("fallback", "No Home Assistant for ${fallback_minutes} min: Smart Grid back to Normal");
          auto call = id(smart_grid).make_call();
          call.set_option("Normal");
          call.perform();
          if (id(control_mode).active_index().value_or(0) == 1) {
            // Home Assistant switched the heat request: the ESP controller takes over
            ESP_LOGW("fallback", "Regelung back to ESP");
            auto mode = id(control_mode).make_call();
            mode.set_option("ESP");
            mode.perform();
          }

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 0

mdns:
  disabled: true

web_server_base:
