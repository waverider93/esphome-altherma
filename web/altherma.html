<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Altherma</title>

<style>
:root{--bg:#edf0f7;--card:#f8faff;--soft:#e4e8f1;--ink:#0a1a33;--ink2:#5c677d;--line:#d6dce8;
--hot:#e0433a;--warm:#f0b545;--cold:#2e86de;--refr:#7d8597;--acc:#0466c8;--ok:#23805f;--bad:#c2413b;--note:#6b4800;
--t1:#737fb9;--t2:#9e7494;--t3:#c1626c;
--shadow:0 1px 2px rgba(0,24,69,.06),0 8px 22px rgba(0,24,69,.07);--r:20px;
--f:ui-rounded,"SF Pro Rounded","Avenir Next",Avenir,"Segoe UI Variable Display","Segoe UI",Nunito,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0b1526;--card:#131f33;--soft:#1a283e;--ink:#e3e9f5;--ink2:#979dac;--line:#24334b;
--hot:#f2645a;--warm:#f3c160;--cold:#4f9cf0;--refr:#979dac;--acc:#5aa2f5;--ok:#62c29b;--bad:#f07a70;--note:#f3d9a4;
--t1:#8995ce;--t2:#b18aaa;--t3:#d37b85;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);font-variant-numeric:tabular-nums;overflow-x:hidden}
.top,main{max-width:1240px;margin:0 auto;padding-left:20px;padding-right:20px}
.top{padding-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.back{flex-basis:100%;font-size:13px;font-weight:600;color:var(--acc);text-decoration:none}
.back:hover{text-decoration:underline}
h1{font-size:22px;font-weight:700;margin:0;line-height:1.2}
.model{font-size:14px;color:var(--ink2);font-weight:500;overflow-wrap:anywhere}
.badge{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bad);color:var(--card)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding-top:14px;padding-bottom:40px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.k{font-size:13px;font-weight:600;color:var(--ink2)}
.big{font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.01em;margin-top:2px;overflow-wrap:anywhere}
.big small{font-size:15px;color:var(--ink2);margin-left:4px;font-weight:500}
.sub{font-size:13px;color:var(--ink2);margin-top:3px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.schem{position:relative;overflow-x:auto;padding:8px;display:flex;flex-direction:column;justify-content:center}
.schem svg{display:block;width:100%;height:auto;min-width:520px}
.hint{display:none;font-size:12px;color:var(--ink2);padding:0 0 6px 12px}
.side{padding:6px 22px}
.side>div{padding:14px 0;border-bottom:1px solid var(--line)}
.side>div:last-child{border:0}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flags span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.flags span.on{background:var(--warm);color:#2e2410}
.status{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;margin-top:4px}
.good{color:var(--ok)}.bad{color:var(--bad)}.attn{color:var(--note)}
.ctl{margin-top:16px;padding:16px 20px}.ctl h2{font-size:17px;margin:0 0 4px}.ctl .row{display:flex;flex-wrap:wrap;gap:10px 28px;margin:12px 0}
.ctl .kv b{display:block;font-size:22px}.ctl .kv span{font-size:13px;color:var(--ink2)}
.ctl .bar{position:relative;height:10px;border-radius:5px;background:var(--line);margin:22px 0 26px}
.ctl .bar i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink2)}.ctl .bar i.now{background:var(--acc);width:8px;top:-5px;height:20px;border-radius:4px}
.ctl .bar em{position:absolute;top:16px;font-size:12px;font-style:normal;color:var(--ink2);transform:translateX(-50%);white-space:nowrap}
.ctl details{margin-top:6px}.ctl summary{cursor:pointer;font-weight:600}.ctl p,.ctl li{font-size:14px;line-height:1.5;color:var(--ink2)}.ctl ul{padding-left:18px}
details.all{margin-top:16px;padding:4px 20px 10px}
details.all summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none}
details.all summary::-webkit-details-marker{display:none}
details.all summary::before{content:"▸";display:inline-block;width:18px;color:var(--ink2)}
details.all[open] summary::before{content:"▾"}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;overflow-wrap:anywhere}
td.n{text-align:right;font-weight:600;padding-right:0}
.pipe{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .8s}
.fl{fill:none;stroke:var(--card);stroke-width:2.4;stroke-dasharray:2 16;stroke-linecap:round;opacity:0}
.flowing .act .fl{opacity:.95;animation:fl .9s linear infinite}
@keyframes fl{to{stroke-dashoffset:-18}}
.br{transition:opacity .6s}.br:not(.act){opacity:.28}
.eq{fill:var(--card);stroke:var(--ink2);stroke-width:1.6}
.ln{fill:none;stroke:var(--ink2);stroke-width:1.5}
.area{fill:var(--soft);stroke:none}
.tag rect{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.tl{font:600 12px var(--f);fill:var(--ink2)}
.tv{font:600 18px var(--f);fill:var(--ink)}
.tb{font:600 38px var(--f);fill:var(--ink)}
.ts{font:500 13px var(--f);fill:var(--ink2)}
#fan{transform-origin:95px 238px;animation:drift 26s ease-in-out infinite}
.fanon #fan{animation:spin 1.6s linear infinite}
@keyframes drift{0%{transform:rotate(0)}10%{transform:rotate(8deg)}18%{transform:rotate(6deg)}34%{transform:rotate(38deg)}42%{transform:rotate(44deg)}50%{transform:rotate(41deg)}68%{transform:rotate(82deg)}80%{transform:rotate(96deg)}90%{transform:rotate(104deg)}100%{transform:rotate(120deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.valve path{fill:var(--card);stroke:var(--ink2);stroke-width:1.5}.valve path.shut{fill:var(--ink2)}
.comp #comp{fill:var(--acc);stroke:var(--acc)}
.buhon #buh{fill:var(--acc);stroke:var(--acc)}
.sens{fill:var(--ink2)}
@media (prefers-reduced-motion:reduce){.flowing .act .fl,#fan{animation:none!important}}
#gZones,.bz{display:none}#sch.bizone #gZones,#sch.bizone .bz{display:block}
#sch.bizone #pSpace,#sch.bizone #pSpace+.fl,#sch.bizone #bSpace,#sch.bizone #pLoop,#sch.bizone #pLoop+.fl,#sch.bizone .sz{display:none}#sch.bizone #gGauge{transform:translate(-48px,-435px)}
#gZones .zoff{opacity:.3}#gZones .zoff .fl{animation:none;opacity:0}
#sch.nodhw .dhw,#sch.noroom .room,#pJoin,#pJoin+.fl{display:none}#sch.nodhw #pJoin,#sch.nodhw #pJoin+.fl{display:block}
@media (max-width:1000px){.dash{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 24px}}
@media (max-width:620px){.top,main{padding-left:16px;padding-right:16px}.hint{display:block}.big{font-size:30px}details.all{padding-left:14px;padding-right:14px}.side{padding:6px 18px}}
</style>
</head>

    ua: 'UA (W/K), {n} Kalibrierungen, nächste in {h} h', how: 'So funktioniert es',
    reasons: {'deficit reached': 'Defizit erreicht', 'deficit covered': 'Defizit gedeckt', 'minimum run time': 'Mindestlaufzeit',
      'minimum pause': 'Mindestpause', 'no demand': 'kein Bedarf', 'deficit not covered': 'Defizit noch nicht gedeckt',
      'room below setpoint': 'Raum zu kalt', 'room above setpoint': 'Raum zu warm', 'no room, setpoint or outside temperature': 'keine Werte von der WP: Heizkurve'},
    text: `<p>Das Haus verliert ständig Wärme. Die WP liefert sie in wenigen langen Läufen statt in vielen kurzen.</p><ul>
<li><b>Defizit</b>: die Wärme, die dem Haus fehlt, in kWh. Jede Minute wächst es um den Wärmeverlust (UA × (Raum − Außen)) und sinkt um die gelieferte Heizwärme (Durchfluss × (Vorlauf − Rücklauf)). Warmwasser zählt nicht.</li>
<li><b>Start</b> bei {start} kWh nach mindestens {pause} h Pause, <b>Stopp</b> bei {stop} kWh nach mindestens {run} h Lauf. Das verhindert das Takten.</li>
<li><b>Raumkorrektur</b>: Das Defizit wird langsam zu {gain} kWh je Kelvin unter Soll gezogen, so summieren sich Fehler nicht auf. Raum mehr als {low} K unter Soll: sofort an, mehr als {high} K über Soll: sofort aus.</li>
<li><b>UA</b> lernt sich selbst: alle 72 h aus der gelieferten Wärme, wenn der Raum am Ende so warm war wie am Anfang. Sonne und Geräte stecken im Mittel mit drin. Bleibt im Flash, auch nach einem Stromausfall.</li>
<li>Ohne Werte von der WP bleibt die Heizanforderung an, die WP fährt nach Heizkurve. Fällt der ESP aus, tut das Relais dasselbe.</li></ul>`}
};
function renderControl(c) {
  const box = $('#ctl'); box.hidden = !c; if (!c) return;
  const L = CTL[lang] || CTL.en, f = v => v == null ? '—' : (+v).toLocaleString(lang, {maximumFractionDigits: 2});
  tx('cTitle', L.title);
  tx('cState', (c.active ? L.active : L.passive) + ' · ' + (c.request ? L.on : L.off) + (c.active && c.reason ? ' (' + (L.reasons[c.reason] || c.reason) + ')' : ''));
  tx('cDef', f(c.deficit)); tx('cDefL', L.deficit); tx('cLoss', f(c.loss)); tx('cLossL', L.loss); tx('cHeat', f(c.heat)); tx('cHeatL', L.heat);
  tx('cUa', f(Math.round(c.ua))); tx('cUaL', L.ua.replace('{n}', c.calibrations).replace('{h}', Math.round(c.calibration_left)));
  const lo = Math.min(c.stop, c.deficit) - 1, hi = Math.max(c.start, c.deficit) + 1, x = v => ((v - lo) / (hi - lo) * 100).toFixed(1) + '%';
  $('#cBar').innerHTML = `<i style="left:${x(c.stop)}"></i><em style="left:${x(c.stop)}">Stop ${f(c.stop)}</em><i style="left:${x(c.start)}"></i><em style="left:${x(c.start)}">Start ${f(c.start)}</em><i class="now" style="left:${x(c.deficit)}"></i>`;
  tx('cHow', L.how);
  $('#cText').innerHTML = L.text.replace('{start}', f(c.start)).replace('{stop}', f(c.stop)).replace('{pause}', f(c.min_pause)).replace('{run}', f(c.min_run))
    .replace('{gain}', f(c.room_gain)).replace('{low}', f(c.room_low)).replace('{high}', f(c.room_high));
}

// ---- data: values.json next to this page, every 10 s
function setLang(code) { if (code === lang) return; lang = code; translatePage(); paint(); renderReadings(); }
async function poll() {
  try {
    const r = await fetch('values.json', {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    setLang(pick(d.lang) || browserLang());
    model = String(d.model || '').replace(/^Altherma\((.*)\)$/, '$1');
    tx('hdrModel', model);
    $('#nc').hidden = d.connected !== false;
    renderValues(Array.isArray(d.values) ? d.values : []);
    renderControl(d.control);
  } catch (e) { $('#nc').hidden = false; }
}
lang = browserLang();
translatePage();
renderValues([]);
poll();
setInterval(poll, 10000);
</script>
</body>
