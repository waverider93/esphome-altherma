# Daikin Altherma 3 R ECH2O (EHSX04P50EF + ERGA04EV) on an ESP32 with relay board.
# X10A: ESP RX <- X10A pin 2 (TX), ESP TX -> X10A pin 3 (RX), GND <- X10A pin 5. See README.
#
# Relay pins are placeholders for an ESP32 board with 4 or 8 relays (LC-Relay-ESP32-4R-A2: probably 32/33/25/26).
# Check them on the board before wiring anything. The relays switch nothing until they are wired, and the heat pump
# only reacts to them after the field settings in README (Relays).

substitutions:
  name: altherma
  x10a_rx: GPIO16
  x10a_tx: GPIO17
  relay_heat: GPIO32  # COM + normally closed -> X12M 15 (H): relay off = heat request
  relay_cool: GPIO33  # COM + normally open   -> X12M 16 (C): relay on  = cool request
  relay_sg1: GPIO25   # X15M 3-4, Smart Grid contact 1 ([D-01]=3)
  relay_sg2: GPIO26   # X15M 5-6, Smart Grid contact 2
  relay_safety: GPIO27  # in series with the bridge X15M 7-8 (normally closed): relay on = heat pump stops
  fallback_minutes: "15"  # without Home Assistant this long, what came from it is reset (see Regelung below)

esphome:
  name: ${name}
  friendly_name: Altherma

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

logger:
  # The X10A uses UART2; keep the log on UART0 (USB)
  level: DEBUG

# Optional: only needed with Regelung "Home Assistant" or "ESP + HA"
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

# Local dashboard on http://altherma.local, works without Home Assistant
web_server:
  version: 3
  port: 80
  local: true
  sorting_groups:
    - id: grp_temp
      name: Temperaturen
      sorting_weight: 10
    - id: grp_state
      name: Zustand
      sorting_weight: 20
    - id: grp_control
      name: Steuerung
      sorting_weight: 30

uart:
  id: x10a_uart
  rx_pin: ${x10a_rx}
  tx_pin: ${x10a_tx}
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1
  data_bits: 8

daikin_x10a:
  id: altherma
  uart_id: x10a_uart
  # A fixed model; the survey after boot still checks it and corrects register layouts. "auto" detects it.
  model: "ERGA E EHSH-X P30-50 E_EF series 04-08kW-ECH2O"
  language: de        # entity names without name: and the diagram page
  diagram: true       # drawing of the installation on http://altherma.local/altherma/
  update_interval: 30s
  # true logs every reply as hex, for comparing with ESPAltherma
  log_raw: false

sensor:
  - platform: daikin_x10a
    label: "Indoor ambient temp. (R1T)"
    name: Raumtemperatur Madoka
    web_server: {sorting_group_id: grp_temp}
  - platform: daikin_x10a
    label: "RT setpoint"
    name: Raum Soll
    web_server: {sorting_group_id: grp_temp}
  - platform: daikin_x10a
    label: "R1T-Outdoor air temp."
    name: Außentemperatur
    web_server: {sorting_group_id: grp_temp}
  - platform: daikin_x10a
    label: "Leaving water temp. before BUH (R1T)"
    name: Vorlauf (R1T)
    web_server: {sorting_group_id: grp_temp}
  - platform: daikin_x10a
    label: "Leaving water temp. after BUH (R2T)"
    name: Vorlauf (R2T)
    web_server: {sorting_group_id: grp_temp}
  - platform: daikin_x10a
    label: "Inlet water temp.(R4T)"
    name: Rücklauf (R4T)
    web_server: {sorting_group_id: grp_temp}
  - platform: daikin_x10a
    label: "DHW tank temp. (R5T)"
    name: Speicher (R5T)
    web_server: {sorting_group_id: grp_temp}
  - platform: daikin_x10a
    label: "LW setpoint (main)"
    name: Vorlauf Soll
    web_server: {sorting_group_id: grp_temp}
  - platform: daikin_x10a
    label: "DHW setpoint"
    name: Warmwasser Soll
    web_server: {sorting_group_id: grp_temp}
  - platform: daikin_x10a
    label: "Flow sensor (l/min)"
    name: Durchfluss
    web_server: {sorting_group_id: grp_state}
  - platform: daikin_x10a
    label: "INV frequency (rps)"
    name: Verdichter
    accuracy_decimals: 0
    web_server: {sorting_group_id: grp_state}
  - platform: daikin_x10a
    label: "RT Control State (0:thermo off 1:thermo on 2:buffering)"
    name: Raumregler Zustand
    accuracy_decimals: 0
    web_server: {sorting_group_id: grp_state}

binary_sensor:
  - platform: daikin_x10a
    label: "Thermostat ON/OFF"
    register: 0x60
    name: Thermostat an
    web_server: {sorting_group_id: grp_state}
  - platform: daikin_x10a
    label: "3way valve(On:DHW_Off:Space)"
    name: Warmwasserventil
    web_server: {sorting_group_id: grp_state}
  - platform: daikin_x10a
    label: "Water pump operation"
    name: Umwälzpumpe
    web_server: {sorting_group_id: grp_state}
  - platform: daikin_x10a
    label: "Defrost Operation"
    name: Abtauen
    web_server: {sorting_group_id: grp_state}
  - platform: daikin_x10a
    label: "Main RT Heating"
    name: Thermostateingang Heizen
    web_server: {sorting_group_id: grp_state}
  - platform: daikin_x10a
    label: "SmartGridContact1"
    name: SG-Kontakt 1
    web_server: {sorting_group_id: grp_state}
  - platform: daikin_x10a
    label: "SmartGridContact2"
    name: SG-Kontakt 2
    web_server: {sorting_group_id: grp_state}
  - platform: template
    name: X10A verbunden
    lambda: return id(altherma).is_connected();
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_state}

text_sensor:
  - platform: daikin_x10a
    label: "I/U operation mode"
    name: Betriebsart
    web_server: {sorting_group_id: grp_state}
  - platform: daikin_x10a
    label: "Error Code"
    register: 0x60
    name: Fehlercode
    web_server: {sorting_group_id: grp_state}
  - platform: daikin_x10a
    info: model
    name: Modell
  - platform: daikin_x10a
    info: detection
    name: Modellerkennung
  - platform: daikin_x10a
    info: layout
    name: Layout-Korrekturen

# --- Relays (stage 3) ---
# Fail-safe: a dead or unpowered ESP leaves the heat pump on its own control (heat request on through the normally
# closed contact, cooling, Smart Grid and the safety contact released).
#
# Who decides is set by "Regelung" (docs/control-concept.md), and only one side ever switches the relays:
#   ESP            the controller on the ESP decides; Home Assistant is not needed (api: can be removed)
#   Home Assistant Home Assistant switches Heizanforderung/Kühlanforderung/Smart Grid; the ESP only executes them
#   ESP + HA       the controller on the ESP decides; Home Assistant only supplies inputs (UA/C, gains, Smart Grid)
# Until the controller runs on the ESP, its modes keep the heat request on (the heat pump's heating curve).

select:
  - platform: template
    id: control_mode
    name: Regelung
    options: [ESP, Home Assistant, ESP + HA]
    initial_option: Home Assistant
    restore_value: true
    optimistic: true
    on_value:
      - script.execute: esp_control
    web_server: {sorting_group_id: grp_control}
  # Smart Grid contacts X15M 3-4 / 5-6 ([D-01]=3): 00 normal, 01 recommended on, 10 blocked, 11 forced on.
  # Set by Home Assistant (modes Home Assistant and ESP + HA); always Normal in mode ESP, which knows no PV or price.
  - platform: template
    id: smart_grid
    name: Smart Grid
    options: [Normal, Einschaltempfehlung, Sperre, Zwangs-EIN]
    initial_option: Normal
    restore_value: false
    optimistic: true
    on_value:
      - lambda: |-
          if (id(control_mode).active_index().value_or(1) == 0 && i != 0) {
            ESP_LOGW("control", "Smart Grid ignored: Regelung is ESP");
            auto call = id(smart_grid).make_call();
            call.set_option("Normal");
            call.perform();
            return;
          }
          id(sg1).set_state(i == 2 || i == 3);
          id(sg2).set_state(i == 1 || i == 3);
    web_server: {sorting_group_id: grp_control}

switch:
  # The relays themselves: internal, switched only through the requests below or the ESP controller.
  # Heat: X12M 15 (H), COM + normally closed, energised to REMOVE the request.
  - platform: gpio
    id: heat_relay
    internal: true
    pin:
      number: ${relay_heat}
      inverted: true
    restore_mode: ALWAYS_ON
    interlock: [cool_relay]
  # Cool: X12M 16 (C), COM + normally open. Only used with [C-05]=2.
  - platform: gpio
    id: cool_relay
    internal: true
    pin: ${relay_cool}
    restore_mode: ALWAYS_OFF
    interlock: [heat_relay]
  # Requests from Home Assistant (or the web page): executed only in mode Home Assistant
  - platform: template
    id: heat_request
    name: Heizanforderung
    lambda: return id(heat_relay).state;
    turn_on_action:
      - if:
          condition: {lambda: return id(control_mode).active_index().value_or(1) == 1;}
          then: [switch.turn_on: heat_relay]
          else: [logger.log: {format: "Heizanforderung ignored: Regelung is not Home Assistant", level: WARN}]
    turn_off_action:
      - if:
          condition: {lambda: return id(control_mode).active_index().value_or(1) == 1;}
          then: [switch.turn_off: heat_relay]
          else: [logger.log: {format: "Heizanforderung ignored: Regelung is not Home Assistant", level: WARN}]
    web_server: {sorting_group_id: grp_control}
  - platform: template
    id: cool_request
    name: Kühlanforderung
    lambda: return id(cool_relay).state;
    turn_on_action:
      - if:
          condition: {lambda: return id(control_mode).active_index().value_or(1) == 1;}
          then: [switch.turn_on: cool_relay]
          else: [logger.log: {format: "Kühlanforderung ignored: Regelung is not Home Assistant", level: WARN}]
    turn_off_action:
      - if:
          condition: {lambda: return id(control_mode).active_index().value_or(1) == 1;}
          then: [switch.turn_off: cool_relay]
          else: [logger.log: {format: "Kühlanforderung ignored: Regelung is not Home Assistant", level: WARN}]
    web_server: {sorting_group_id: grp_control}
  # Opens the safety thermostat loop X15M 7-8: the heat pump stops with an error. Emergency use only, any mode.
  - platform: gpio
    id: safety_stop
    name: Sicherheitsabschaltung
    icon: mdi:alert-octagon
    pin: ${relay_safety}
    restore_mode: ALWAYS_OFF
    web_server: {sorting_group_id: grp_control}

output:
  - platform: gpio
    id: sg1
    pin: ${relay_sg1}
  - platform: gpio
    id: sg2
    pin: ${relay_sg2}

script:
  # The controller on the ESP (modes ESP and ESP + HA). Placeholder until the deficit controller is built:
  # heat request on, so the heat pump follows its heating curve.
  - id: esp_control
    then:
      - if:
          condition: {lambda: return id(control_mode).active_index().value_or(1) != 1;}
          then:
            - switch.turn_on: heat_relay
            - lambda: |-
                if (id(control_mode).active_index().value_or(1) == 0) {
                  auto call = id(smart_grid).make_call();
                  call.set_option("Normal");
                  call.perform();
                }

globals:
  - id: minutes_without_ha
    type: int
    initial_value: "0"

interval:
  - interval: 1min
    then:
      - lambda: |-
          bool ha = false;
          #ifdef USE_API
          ha = api::global_api_server->is_connected();
          #endif
          if (ha) {
            id(minutes_without_ha) = 0;
            return;
          }
          if (++id(minutes_without_ha) != ${fallback_minutes})
            return;
          int mode = id(control_mode).active_index().value_or(1);
          if (mode == 0)
            return;  // ESP: nothing comes from Home Assistant
          ESP_LOGW("fallback", "No Home Assistant for ${fallback_minutes} min: Smart Grid back to Normal");
          auto call = id(smart_grid).make_call();
          call.set_option("Normal");
          call.perform();
          if (mode == 1) {
            // Home Assistant decided: the heat pump takes over with its heating curve
            ESP_LOGW("fallback", "Heat request back to the heat pump's heating curve");
            if (!id(cool_relay).state)
              id(heat_relay).turn_on();
          }
          // ESP + HA: the controller on the ESP goes on with the last values
